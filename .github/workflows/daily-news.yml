name: 毎朝のニュース更新

on:
  schedule:
    - cron: '30 20 * * *'  # 毎朝 5:30（日本時間）。GitHub 側の混雑で数十分遅れることがある
  workflow_dispatch:        # Actions 画面から手動で実行できる
  push:
    branches: [main]        # コードを更新したときは、ニュース処理なしで公開ページだけ作り直す

permissions:
  contents: write  # 生成したニュースデータをリポジトリに保存するため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ニュースを集めて採点・要約
        if: github.event_name != 'push'
        run: npm run news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 生成データをリポジトリに保存
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data
          git diff --cached --quiet || git commit -m "ニュース更新 $(TZ=Asia/Tokyo date +%F)"
          git push

      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
