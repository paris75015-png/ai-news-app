name: AI日報の更新

on:
  schedule:
    # 平日 16:43（日本時間）= 米国の深夜。AI の無料枠が比較的空いている時間帯。
    # 正時・30分ちょうどは GitHub 側も混むので、半端な分にしている。数十分遅れることがある
    # 07:43 UTC + 9時間 = 同じ日の 16:43 JST。曜日も UTC と JST で一致するため 1-5 でよい
    # 国際深掘り（07:30、予備 11:30 JST）も平日のみ。揃えている
    - cron: '43 7 * * 1-5'
  workflow_dispatch:        # Actions 画面から手動で実行できる
    inputs:
      haiku_only:
        description: '比較用の Haiku 版だけを動かす（紙面は更新しない）'
        type: boolean
        default: false
  push:
    branches: [main]        # コードを更新したときは、ニュース処理なしで公開ページだけ作り直す

permissions:
  contents: write  # 生成したニュースデータをリポジトリに保存するため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: ${{ !inputs.haiku_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 何かで止まっても60分で打ち切る（採点の混雑待ち 最大19分＋要約 最大20分が収まる長さ）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: AI日報を集めて採点・要約
        if: github.event_name != 'push'
        run: npm run news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  # 任意（予備の要約AI）

      - name: 生成データをリポジトリに保存
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data
          git diff --cached --quiet || git commit -m "AI日報 $(TZ=Asia/Tokyo date +%F)"
          # 同じ日の朝に深掘り2系統が push しているので、取り込んでから送る
          git pull --rebase
          git push

      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5

  # 比較試験（2026-11-02〜06）：同じ処理を Gemini の代わりに Claude Haiku で行い、haiku-compare ブランチに記録する。
  # 紙面（main・公開ページ）には書き込まない。同じきっかけで動くので、Gemini 版とほぼ同時刻に始まる。
  # 期間を過ぎると何もしない（pipeline/compare/haiku.sh の LAST_DAY）。
  haiku:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: AI日報（Haiku 版）
        run: bash pipeline/compare/haiku.sh ai
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Gemini 版でも上位10件の要約は Groq が担当している。Gemini の担当分だけを Haiku に替えるため、Groq はそのまま使う
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
