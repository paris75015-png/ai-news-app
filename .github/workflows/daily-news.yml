name: AI日報の更新

on:
  schedule:
    # 平日 16:43（日本時間）= 米国の深夜。AI の無料枠が比較的空いている時間帯。
    # 正時・30分ちょうどは GitHub 側も混むので、半端な分にしている。数十分遅れることがある
    # 07:43 UTC + 9時間 = 同じ日の 16:43 JST。曜日も UTC と JST で一致するため 1-5 でよい
    # 深掘り2系統（07:00 / 07:30 JST）も平日のみ。3系統で揃えている
    - cron: '43 7 * * 1-5'
  workflow_dispatch:        # Actions 画面から手動で実行できる
  push:
    branches: [main]        # コードを更新したときは、ニュース処理なしで公開ページだけ作り直す

permissions:
  contents: write  # 生成したニュースデータをリポジトリに保存するため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 何かで止まっても30分で打ち切る
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: AI日報を集めて採点・要約
        if: github.event_name != 'push'
        run: npm run news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  # 任意（予備の要約AI）

      - name: 生成データをリポジトリに保存
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data
          git diff --cached --quiet || git commit -m "AI日報 $(TZ=Asia/Tokyo date +%F)"
          # 同じ日の朝に深掘り2系統が push しているので、取り込んでから送る
          git pull --rebase
          git push

      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
