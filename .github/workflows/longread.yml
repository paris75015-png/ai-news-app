name: 読み物の資料（試験・手動）

# 試験中の「日替わりテーマの読み物」の資料づくり。紙面には出さない。
# Claude の定額枠を毎朝のニュースに回すため、2026-11-01 から定時実行をやめ、手動（Actions 画面の Run workflow）だけにした。

on:
  workflow_dispatch:
    inputs:
      theme_day:
        description: '試すテーマの曜日（1=政治 2=経済 3=社会 4=紛争・安全保障 5=自由）。空なら当日の曜日'
        default: ''

permissions:
  contents: write

concurrency:
  group: longread
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLM_PROVIDER: claude
      CLAUDE_MODEL: claude-haiku-5-5
      CLAUDE_CODE_MAX_OUTPUT_TOKENS: '64000'
      GEMINI_API_KEY: unused
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
      - run: |
          TOKEN="$(printf %s "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          CLAUDE_CODE_OAUTH_TOKEN="$TOKEN" node pipeline/longread/collect.mjs
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LONGREAD_THEME_DAY: ${{ inputs.theme_day }}
      - name: 資料をリポジトリに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/longread
          git diff --cached --quiet || git commit -m "読み物の資料（試験） $(TZ=Asia/Tokyo date +%F)"
          git pull --rebase
          git push
