name: 世界の注目度

on:
  schedule:
    # 平日 06:20（日本時間）。Sonnet の深掘り（07:30）より前に、資料を用意しておく
    # 21:20 UTC + 9時間 = 翌日 06:20 JST。UTC では日〜木に当たる
    - cron: '20 21 * * 0-4'
  workflow_dispatch:
    inputs:
      briefs_only:
        description: '短信だけ作り直す（見出しの収集・順位づけ・資料づくりは行わない）'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages   # 公開ページを作る他の処理（AI日報）と順番に動かす
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node pipeline/attention/fetch.mjs
        if: ${{ !inputs.briefs_only }}
      - run: node pipeline/attention/rank.mjs
        if: ${{ !inputs.briefs_only }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: node pipeline/attention/dossier.mjs
        if: ${{ !inputs.briefs_only }}
      - run: node pipeline/attention/briefs.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: 結果をリポジトリに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/attention data/attention/stories.json data/dossiers
          git diff --cached --quiet || git commit -m "世界の注目度 $(TZ=Asia/Tokyo date +%F)"
          git pull --rebase
          git push

      # Actions が push しても、公開ページを作り直す処理は自動では起動しない。ここで作って公開する
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
