name: 世界の注目度

on:
  schedule:
    # 平日 03:20（日本時間）。Sonnet の深掘り（07:30、予備 11:30）より前に、資料を用意しておく
    # GitHub の定時実行は数時間遅れることがある。2026-10-21〜30 は 2.5〜4時間遅れ、06:20 の設定では
    # 07:30 に資料が間に合わず、国際深掘りが8営業日続けて空振りした。そのため3時間早めている
    # 18:20 UTC + 9時間 = 翌日 03:20 JST。UTC では日〜木に当たる
    - cron: '20 18 * * 0-4'
  workflow_dispatch:
    inputs:
      briefs_only:
        description: '短信だけ作り直す（見出しの収集・順位づけ・資料づくりは行わない）'
        type: boolean
        default: false
      haiku_only:
        description: '比較用の Haiku 版だけを動かす（紙面は更新しない）'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages   # 公開ページを作る他の処理（AI日報）と順番に動かす
  cancel-in-progress: false

jobs:
  update:
    if: ${{ !inputs.haiku_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node pipeline/attention/fetch.mjs
        if: ${{ !inputs.briefs_only }}
      - run: node pipeline/attention/rank.mjs
        if: ${{ !inputs.briefs_only }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: node pipeline/attention/dossier.mjs
        if: ${{ !inputs.briefs_only }}
      - run: node pipeline/attention/briefs.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: 結果をリポジトリに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/attention data/attention/stories.json data/dossiers
          git diff --cached --quiet || git commit -m "世界の注目度 $(TZ=Asia/Tokyo date +%F)"
          git pull --rebase
          git push

      # Actions が push しても、公開ページを作り直す処理は自動では起動しない。ここで作って公開する
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5

  # 比較試験（2026-11-02〜06）：同じ処理を Gemini の代わりに Claude Haiku で行い、haiku-compare ブランチに記録する。
  # 紙面（main・公開ページ）には書き込まない。同じきっかけで動くので、Gemini 版とほぼ同時刻に始まる。
  # 期間を過ぎると何もしない（pipeline/compare/haiku.sh の LAST_DAY）。
  haiku:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 世界の注目度・国際深掘り（Haiku 版）
        run: bash pipeline/compare/haiku.sh attention
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
