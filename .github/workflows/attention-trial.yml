name: 注目度の試作

on:
  workflow_dispatch:  # 手動実行のみ。公開ページには影響しない

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node pipeline/attention/fetch.mjs
      - run: node pipeline/attention/rank.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: attention
          path: data/attention/
